<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrimToken Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .preview-modal {
      background: #16213e;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 900px;
      animation: slideIn 0.3s ease-out;
      border: 1px solid #444;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .preview-header {
      padding: 24px;
      border-bottom: 1px solid #444;
    }

    .preview-header h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .preview-stat {
      font-size: 13px;
      color: #aaa;
    }

    .preview-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 300px;
    }

    @media (max-width: 700px) {
      .preview-split {
        grid-template-columns: 1fr;
      }
    }

    .preview-column {
      padding: 20px;
      border-right: 1px solid #444;
      overflow-y: auto;
      max-height: 400px;
    }

    .preview-column:last-child {
      border-right: none;
    }

    .preview-column h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ccc;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .preview-text {
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      margin-bottom: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }

    .token-count {
      font-size: 12px;
      color: #888;
    }

    .preview-column.compressed .preview-text {
      border-left: 3px solid #4caf50;
    }

    .preview-actions {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      border-top: 1px solid #444;
      background: rgba(0, 0, 0, 0.2);
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-approve {
      background: #4caf50;
      color: white;
    }

    .btn-approve:hover {
      background: #45a049;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
    }

    .btn-secondary {
      background: #2196f3;
      color: white;
    }

    .btn-secondary:hover {
      background: #0b7dda;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
    }

    .btn-reject {
      background: #f44336;
      color: white;
    }

    .btn-reject:hover {
      background: #da190b;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
    }
  </style>
</head>
<body>
  <div class="preview-modal" id="modalRoot">
    <div class="preview-header">
      <h2>Review Before Pasting</h2>
      <p class="preview-stat" id="statText">Loading...</p>
    </div>

    <div class="preview-split">
      <div class="preview-column original">
        <h3>Original</h3>
        <p class="preview-text" id="originalText"></p>
        <p class="token-count" id="originalTokens"></p>
      </div>

      <div class="preview-column compressed">
        <h3>Compressed ✓</h3>
        <p class="preview-text" id="compressedText"></p>
        <p class="token-count" id="compressedTokens"></p>
      </div>
    </div>

    <div class="preview-actions">
      <button class="btn btn-approve" id="btnApprove">Paste Compressed</button>
      <button class="btn btn-secondary" id="btnOriginal">Paste Original</button>
      <button class="btn btn-reject" id="btnReject">Cancel</button>
    </div>
  </div>

  <script src="preview-modal.js"></script>
</body>
</html>
